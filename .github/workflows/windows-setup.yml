name: Windows Setup

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: -r requirements.txt
          python -m pip install pyinstaller
      - name: Build application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name AliciaVoiceChat --collect-all faster_whisper --collect-all ctranslate2 alicia_voice_chat.py
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AliciaVoiceChat-Setup
          path: output/AliciaVoiceChat_Setup.exe
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/AliciaVoiceChat_Setup.exe
