name: Windows Setup
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: av
          python -m pip install -r requirements.txt pyinstaller
      - name: Build application
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name AliciaVoiceChat --collect-all faster_whisper --collect-all ctranslate2 --collect-all tokenizers alicia_voice_chat.py
      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: AliciaVoiceChat-Setup
          path: output/AliciaVoiceChat_Setup.exe
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/AliciaVoiceChat_Setup.exe
